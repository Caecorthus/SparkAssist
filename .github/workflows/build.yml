# Fresh-clone checks for every PR and every push to main.
# `check` has no dependencies in this build, so `build` runs none of the verify tasks; each is named explicitly.
# Only the two tracked Ponder tests run here; the rest of src/test is gitignored and runs locally.
# 每个 PR 与每次推送 main 时的全新克隆检查。
# 本构建的 `check` 不依赖任何任务，`build` 不会运行校验任务，因此需逐个显式列出。
# 这里只运行两个已入库的 Ponder 测试；src/test 的其余部分不进 git，仍在本地运行。
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Depth 2 so the whitespace check can diff against the first parent (the base tip on a PR merge ref).
      # 深度 2，使空白检查能与第一父提交比较（PR 合并引用上即基础分支末端）。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The Wathe development jar is not tracked in this repository (libs/README.md). Fetch the copy that
      # SparkFactionAPI tracks, at a pinned commit; verifyWatheDependency then checks its SHA-256.
      # Wathe 开发 jar 不进本仓库（见 libs/README.md）。从 SparkFactionAPI 的固定提交取其已入库的副本，
      # 再由 verifyWatheDependency 校验 SHA-256。
      - name: Fetch the Wathe development jar
        env:
          FACTION_API_COMMIT: 72c34f3708cd4260f4baf29ac66b3450c8d05923
        run: |
          wathe_version="$(sed -n 's/^wathe_version=//p' gradle.properties)"
          curl --fail --silent --show-error --location \
            --output "libs/wathe-${wathe_version}.jar" \
            "https://raw.githubusercontent.com/Caecorthus/SparkFactionAPI/${FACTION_API_COMMIT}/libs/wathe-${wathe_version}.jar"

      - name: Build and verify
        run: ./gradlew --no-daemon --console=plain build test verifyWatheDependency verifyModJarVersion verifyArchitecture verifyDistributionMetadata

      - name: Whitespace check
        run: git diff --check HEAD^1 HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: sparkassist-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 14
